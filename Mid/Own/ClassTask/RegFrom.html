<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <head>
        <title>Patient Registration Form</title>
    </head>
    <body> 
        <h1>Patient Registration Form</h1>
        <fieldset>
            <legend>Patient Information</legend>
            <table>
                <tr>
                    <td> <label for="PatientName">Patient Name:</label> </td>
                    <td> <input type="text" id="PatientName" placeholder="Enter Your Name" name="PatientName" required> </td>

                </tr>
                <tr>
                    <td> <label for="PatientAge">Patient Age:</label> </td>
                    <td> <input type="number" id="PatientAge" placeholder="Enter Your Age" name="PatientAge" required> </td>
                </tr>
                <tr> 
                    <td> <label for="PatientEmail">Patient Email:</label> </td>
                    <td> <input type="email" id="PatientEmail" placeholder="Enter Your Email" name="PatientEmail" required> </td>
                </tr>
                <tr> 
                    <td><label for="PatientGender"> Gender : </label></td>
                    <td>
                        <input type="radio" id="Male" name="PatientGender" value="Male" required>
                        <label for="Male">Male</label>
                        <input type="radio" id="Female" name="PatientGender" value="Female">
                        <label for="Female">Female</label>
                    </td>

                </tr>
            </table>
        </fieldset>
    </body>
</html>
